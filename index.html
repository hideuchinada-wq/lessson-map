<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;

  }
  header {
    padding: 10px 16px;

    flex-wrap: wrap;

  }

  header input[type="search"] {
    padding: 6px 10px;
    border: none;
    border-radius: 4px;
    width: 240px;
    font-size: 0.9rem;
  }
  header label { font-size: 0.9rem; cursor: pointer; display: flex; align-items: center; gap: 4px; }

    background: #fff;
    color: #1e6fd9 !important;
    padding: 6px 10px;
    border-radius: 4px;

    font-size: 0.85rem;
    border-bottom: 1px solid #f0d9b0;
  }
  #map { height: calc(100vh - 110px); width: 100%; }
  .pin {
    width: 32px;
    height: 32px;
    border-radius: 50% 50% 50% 0;
    transform: rotate(-45deg);
    background: #e53935;
    border: 2px solid #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,0.35);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .pin span { transform: rotate(45deg); font-size: 14px; line-height: 1; }
  .pin.accessible { background: #2e7d32; }
  .popup h3 { margin: 0 0 6px; font-size: 1rem; }
  .popup table { border-collapse: collapse; font-size: 0.8rem; }
  .popup td { border-bottom: 1px solid #eee; padding: 3px 6px; vertical-align: top; }
  .popup td:first-child { color: #555; white-space: nowrap; }
  .popup .addr { font-size: 0.8rem; color: #555; margin: 0 0 6px; }

16, 173657, UN0000058128, 石川県内灘町, 内灘海水浴場, ウチナダカイスイヨクジョウ, Uchinada Beach, 173657, , 石川県河北郡内灘町字千鳥台4丁目153番地先, 石川県, 河北郡内灘町, 字千鳥台4丁目, 153番地先, , 入口横, 36.64045, 136.62397, , , 4, 3, 1, 0, 3, 3, 0, 1, 0, 1, 1, 有, 無, 無, 7:00, 18:00, 冬期閉鎖(12月～2月）, , , 所管：地域産業振興課
17, 173657, UN0000058129, 石川県内灘町, 道の駅内灘サンセットパーク, ミチノエキウチナダサンセットパーク, Road Station Uchinada Sunset Park, 173657, , 石川県河北郡内灘町字大学1丁目4番地1, 石川県, 河北郡内灘町, 字大学1丁目, 4番地1, , 店舗横, 36.659151, 136.648919, , , 3, 2, 0, 1, 2, 0, 2, 1, 0, 1, 1, 有, 無, 無, 0:00, 23:59, 24時間利用可。, , , 所管：地域産業振興課`;

// ===== 状態 =====
let map;
let markerLayer;
let allRows = [];

// ===== ユーティリティ =====
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

// UTF-8を試し、失敗したらShift_JISで decode
function decodeBuffer(buf) {
  try {
    return new TextDecoder('utf-8', { fatal: true }).decode(buf);
  } catch (e) {
    return new TextDecoder('shift_jis').decode(buf);
  }
}

// CSVをオブジェクト配列に変換（列名をキーにする）
function parseCSV(text) {
  const lines = text.replace(/^\uFEFF/, '').split(/\r?\n/).filter(l => l.trim() !== '');
  if (lines.length === 0) return [];
  const headers = lines[0].split(',').map(h => h.trim());
  return lines.slice(1).map(line => {
    const cols = line.split(',').map(c => c.trim());
    const row = {};
    headers.forEach((h, i) => row[h] = cols[i] ?? '');
    return row;
  });
}

function showStatus(msg) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.style.display = msg ? 'block' : 'none';
}

// ===== 地図 =====
function initMap() {
  map = L.map('map').setView([36.65, 136.64], 13);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);
  markerLayer = L.layerGroup().addTo(map);
}

function isAccessible(r) {
  return r['車椅子使用者用トイレ有無'] === '有';
}

function makePopup(r) {
  const hours = (r['利用開始時間'] && r['利用終了時間'])
    ? `${r['利用開始時間']} ～ ${r['利用終了時間']}` : '-';
  const rows = [
    ['男性トイレ総数', r['男性トイレ総数']],
    ['女性トイレ総数', r['女性トイレ総数']],
    ['男女共用トイレ総数', r['男女共用トイレ総数']],
    ['バリアフリートイレ数', r['バリアフリートイレ数']],
    ['車椅子使用者用', r['車椅子使用者用トイレ有無']],
    ['乳幼児用設備', r['乳幼児用設備設置トイレ有無']],
    ['オストメイト', r['オストメイト設置トイレ有無']],
    ['利用時間', hours],
    ['利用可能時間特記', r['利用可能時間特記事項']],
    ['備考', r['備考']]
  ].filter(([, v]) => v !== undefined && v !== '')
   .map(([k, v]) => `<tr><td>${esc(k)}</td><td>${esc(v)}</td></tr>`).join('');

  return `
    <div class="popup">
      <h3>${esc(r['名称'])}</h3>
      <p class="addr">${esc(r['所在地_連結表記'])}<br>設置位置：${esc(r['設置位置'])}</p>
      <table>${rows}</table>
    </div>`;
}

function renderMarkers() {
  const keyword = document.getElementById('search').value.trim();
  const onlyAccessible = document.getElementById('accessible').checked;

  markerLayer.clearLayers();

  const filtered = allRows.filter(r => {
    if (onlyAccessible && !isAccessible(r)) return false;
    if (keyword) {
      const target = `${r['名称'] ?? ''} ${r['所在地_連結表記'] ?? ''} ${r['設置位置'] ?? ''}`;
      if (!target.includes(keyword)) return false;
    }
    return true;
  });

  const latlngs = [];
  filtered.forEach(r => {
    const lat = parseFloat(r['緯度']);
    const lng = parseFloat(r['経度']);
    if (isNaN(lat) || isNaN(lng)) return;

    const icon = L.divIcon({
      className: '',
      html: `<div class="pin ${isAccessible(r) ? 'accessible' : ''}"><span>🚻</span></div>`,
      iconSize: [32, 32],
      iconAnchor: [16, 32],
      popupAnchor: [0, -32]
    });

    L.marker([lat, lng], { icon })
      .bindPopup(makePopup(r), { maxWidth: 300 })
      .addTo(markerLayer);
    latlngs.push([lat, lng]);
  });

  document.getElementById('count').textContent = `表示: ${latlngs.length} / ${allRows.length} 件`;

  if (latlngs.length > 0 && (keyword || onlyAccessible)) {
    map.fitBounds(latlngs, { padding: [40, 40], maxZoom: 16 });
  }
}

function setRows(rows, sourceName) {
  allRows = rows;
  renderMarkers();
  const bounds = allRows
    .map(r => [parseFloat(r['緯度']), parseFloat(r['経度'])])
    .filter(([a, b]) => !isNaN(a) && !isNaN(b));
  if (bounds.length) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 16 });
  console.log(`読み込み: ${sourceName} (${rows.length}件)`);
}

// ===== データ読み込み =====
async function loadFromFetch() {
  const res = await fetch(CSV_FILENAME);
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return decodeBuffer(await res.arrayBuffer());
}

async function init() {
  initMap();

  document.getElementById('search').addEventListener('input', renderMarkers);
  document.getElementById('accessible').addEventListener('change', renderMarkers);

  document.getElementById('file').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    const text = decodeBuffer(await file.arrayBuffer());
    showStatus('');
    setRows(parseCSV(text), file.name);
  });

  try {
    const text = await loadFromFetch();
    setRows(parseCSV(text), CSV_FILENAME);
  } catch (err) {
    setRows(parseCSV(SAMPLE_CSV), 'サンプルデータ');
    showStatus(`「${CSV_FILENAME}」を直接読み込めなかったため、埋め込みのサンプルデータを表示しています。` +
               `ローカルで開く場合は、右上の「CSVを選択」からCSVを読み込んでください。`);
  }
}

init();
</script>
