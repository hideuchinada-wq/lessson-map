<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>内灘町公共トイレマップ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; }
    #map { width: 100vw; height: 100vh; }
    .red-pin {
      color: #fff;
      background: #b44848;
      border: 3px solid #fff;
      width: 24px;
      height: 24px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      box-shadow: 0 2px 7px #0005;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Leaflet.js -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- PapaParse for CSV parsing -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <script>
    // マップの初期化（内灘町中心、ズーム13）
    const map = L.map('map').setView([36.657, 136.648], 13);

    // OSMタイルレイヤーの追加
    const osm = L.tileLayer(
      'https://tile.openstreetmap.jp/{z}/{x}/{y}.png',
      {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>'
      }
    ).addTo(map);

    // 赤いピンのカスタムアイコン定義
    const redIcon = L.divIcon({
      className: '',
      html: '<div class="red-pin"></div>',
      iconSize: [24, 24],
      iconAnchor: [12, 24]
    });

    // 公共トイレマーカーグループ
    const toiletMarkers = L.layerGroup().addTo(map);

    // CSVファイルパス（HTMLと同じフォルダにあるCSVファイルを指す）
    const csvFilePath = '173657_public_toilet.csv';

    // CSVの読み込みとマーカー設定
    Papa.parse(csvFilePath, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        results.data.forEach(item => {
          const lat = parseFloat(item['緯度']);
          const lng = parseFloat(item['経度']);
          const name = item['名称'] || '名称不明';

          if (!isNaN(lat) && !isNaN(lng)) {
            const marker = L.marker([lat, lng], { icon: redIcon })
              .bindPopup(`<b>${name}</b>`);
            toiletMarkers.addLayer(marker);
          }
        });
      },
      error: function(error) {
        console.error('CSVファイルの読み込みエラー:', error);
        alert('CSVファイルの読み込みに失敗しました。');
      }
    });

    // レイヤーコントロール追加（基本地図と公共トイレマーカー表示切替）
    L.control.layers(
      { '基本マップ（OSM）': osm },
      { '公共トイレ': toiletMarkers }
    ).addTo(map);
  </script>
</body>
</html>
