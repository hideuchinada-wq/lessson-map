<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>内灘町トイレマップ</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; }
    #map { width: 100vw; height: 100vh; }
    .red-pin {
      color: #fff; background: #b44848; border: 3px solid #fff;
      width: 24px; height: 24px; border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg); box-shadow: 0 2px 7px #0005;
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <!-- Leaflet ライブラリ -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- PapaParse ライブラリ（CSVパース用） -->
  <script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

  <script>
    // Leaflet マップ初期化（内灘町中心）
    const map = L.map('map').setView([36.657, 136.648], 13);

    // OSM タイルレイヤー
    const osm = L.tileLayer(
      'https://tile.openstreetmap.jp/{z}/{x}/{y}.png',
      {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap contributors</a>'
      }).addTo(map);

    // 赤いピンのカスタムアイコン定義
    const redIcon = L.divIcon({
      className: '',
      html: '<div class="red-pin"></div>',
      iconSize: [24, 24],
      iconAnchor: [12, 24]
    });

    // トイレマーカーグループ
    const toiletMarkers = L.layerGroup().addTo(map);

    // CSVファイルパス（適宜変更してください）
    const csvFilePath = '173657_public_toilet.csv';

    // CSV読み込みとマーカー設置
    Papa.parse(csvFilePath, {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: function(results) {
        results.data.forEach(item => {
          const lat = parseFloat(item['緯度']);
          const lng = parseFloat(item['経度']);
          const name = item['名称'] || '名前不明';

          if (!isNaN(lat) && !isNaN(lng)) {
            // マーカー作成
            const marker = L.marker([lat, lng], { icon: redIcon })
              .bindPopup(`<b>${name}</b>`);
            toiletMarkers.addLayer(marker);
          }
        });
      },
      error: function(err) {
        console.error('CSV読み込みエラー:', err);
      }
    });

    // レイヤーコントロール（基本マップと表示アイテム切替）
    L.control.layers(
      { '基本マップ（OSM）': osm },
      { '公共トイレ': toiletMarkers }
    ).addTo(map);
  </script>
</body>
</html>
